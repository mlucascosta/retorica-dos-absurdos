version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', 'nuxt-*', 'vue', 'vue-router']
      estilo:
        patterns: ['tailwindcss', '@tailwindcss/*', 'daisyui', '@fontsource*', '@iconify-json/*']
    ignore:
      # TypeScript 7 fica de fora até o vue-tsc confirmar suporte (ver docs/adr/0001).
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
